name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --build-tags=integration

  test:
    name: Test (unit + integration, race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # GitHub-hosted Ubuntu runners have Docker, which testcontainers uses to
      # start real PostgreSQL 16 and Redis 7 containers.
      - name: Unit and integration tests
        run: go test -race -count=1 -tags=integration -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  docker:
    name: Docker build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, mockprovider]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: notifications-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: [test, docker]
    env:
      MOCK_FAILURE_RATE: "0" # deterministic: only the seed's forced failures fail
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Health checks
        run: |
          curl -fsS localhost:8080/health/ready
          curl -fsS localhost:8082/health/ready
      - name: Send a batch and wait for deliveries
        run: |
          ./scripts/seed.sh
          for i in $(seq 1 30); do
            sent=$(curl -fsS 'localhost:8080/api/v1/metrics/summary?window=1h' | jq '.overall.sent')
            echo "sent=$sent"
            # The seed batch has 6 deliverable items (+1 permanent, +1 retryable failure).
            if [ "$sent" -ge 6 ]; then exit 0; fi
            sleep 2
          done
          echo "notifications were not delivered in time" >&2
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
